name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: city_api_test
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
        env:
          CITY_API_DB_URL: localhost
          CITY_API_DB_PORT: 5432
          CITY_API_DB_USER: admin
          CITY_API_DB_PWD: password
          CITY_API_DB_NAME: city_api_test
