name: build
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/build.yml"
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Analyse repo for security vulnerabilities
      - name: Run Trivy vulnerability scanner (FS mode)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-fs-results.sarif"
          severity: "CRITICAL,HIGH"
          scanners: "vuln,secret,misconfig"
          exit-code: "1"

      - name: Upload Trivy FS scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-fs-results.sarif"
          category: "trivy-fs"

      # Build docker image
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build with layer caching
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          tags: backend:latest
          # Load the built image into the local Docker daemon so Trivy can scan it
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Analyse docker image for security vulnerabilities
      - name: Run Trivy vulnerability scanner (Image mode)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "backend:latest"
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-image-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Upload Trivy Image scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-image-results.sarif"
          category: "trivy-image"
